user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 1024;
	# multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include       mime.types;
    default_type  application/octet-stream;

    # rate limit zones

    # default
    limit_req_zone $binary_remote_addr zone=default_limit:10m rate=50r/s;

    # api
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # register and login
    limit_req_zone $binary_remote_addr zone=login_register:10m rate=1r/m;

    # creating server
    limit_req_zone $binary_remote_addr zone=create_server:10m rate=1r/s;

    # create channel
    limit_req_zone $binary_remote_addr zone=create_channel:10m rate=1r/s;

    # create/edit/delete chat message
    limit_req_zone $binary_remote_addr zone=chat_message:10m rate=1r/s;

    # upload avatar
    limit_req_zone $binary_remote_addr zone=upload_avatar:10m rate=1r/m;

    # upload attachments
    limit_req_zone $binary_remote_addr zone=upload_attachment:10m rate=10r/m;

    # maximum per ip
    limit_conn_zone $binary_remote_addr zone=ip_limit:10m;

    proxy_cache_path /var/www/nginx_avatar_cache
        levels=1:2
        keys_zone=avatar_cache:16m
        max_size=8g
        inactive=30d
	    use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name 127.0.0.1;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;
        http3 on;

        add_header Alt-Svc 'h3=":443"; ma=86400';

        server_name 127.0.0.1;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        gzip on;

        set $backend_server http://127.0.0.1:3000;

        # shared headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # avatar cache
	    location ~ ^/avatars/.*\.webp$ {
            proxy_cache avatar_cache;

            proxy_pass $backend_server;
        }

        # registration
        location ~ ^/api/v\d+/user/register$ {
            limit_req zone=login_register burst=3 nodelay;
            limit_req_status 429;

            proxy_pass $backend_server;
        }

        # login
        location ~ ^/api/v\d+/user/login$ {
            limit_req zone=login_register burst=4 nodelay;
            limit_req_status 429;

            proxy_pass $backend_server;
        }

        # creating server
        location ~ ^/api/v\d+/server$ {
            limit_req zone=create_server burst=2 nodelay;
            limit_req_status 429;

            proxy_pass $backend_server;
        }

        # creating channel
        location ~ ^/api/v\d+/server/[^/]+/channel$ {
            limit_req zone=create_channel burst=2 nodelay;
            limit_req_status 429;

            proxy_pass $backend_server;
        }

        # create/edit/delete chat message
        location ~ ^/api/v\d+/(channel/[^/]+/message|message/[^/]+)$ {
            limit_req zone=chat_message burst=5 nodelay;
            limit_req_status 429;

            proxy_pass $backend_server;
        }

        # uploading user or server avatar
        location ~ ^/api/v\d+/.+/upload/avatar$ {
            limit_req zone=upload_avatar burst=3 nodelay;
            limit_req_status 429;

            proxy_request_buffering on;
            client_body_timeout 10s;
            client_max_body_size 2M;
            client_body_buffer_size 2M;
            proxy_ignore_client_abort off;
  
            proxy_pass $backend_server;
        }

        # uploading attachments
        location ~ ^/api/v\d+/upload/attachment$ {
            limit_req zone=upload_attachment burst=3 nodelay;
            limit_req_status 429;

            client_max_body_size 16M;

            proxy_request_buffering on;
            client_body_buffer_size 4M;

            client_body_timeout 120s;
  
            proxy_pass $backend_server;
        }

        # websocket
        location /ws {
            limit_conn ip_limit 5;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 20;
            proxy_send_timeout 20;

            proxy_pass $backend_server;
        }

        # all endpoints
        location / {
            limit_req zone=default_limit burst=100 delay=25;

            proxy_pass $backend_server;
        }

        # /api call if not specified below
        location /api/ {
            limit_req zone=api burst=10 delay=6;

            proxy_pass $backend_server;
        }
    }
}
